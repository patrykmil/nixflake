# Mirrors modules/hyprland/hyprland-common.lua (keybinds, outputs, input, rules).
# Cosmetics left at Umbriel defaults: no [animation]/[effects] sections here.
# Noctalia colors arrive via [include.optional] noctalia.toml — enable the
# Umbriel template under Settings → Templates → Compositors.

[general]
autostart = ["noctalia", "wallpaperSchedule", "sunsetr"]
# hyprland autostarts hyprsunset here; it needs Hyprland IPC, so sunsetr
# replaces it. `bright` (modules/scripts/brightness.py) is hyprctl-based too
# and silently no-ops outside Hyprland — use `sunsetr set` there instead.
mod_key = "Super"
xwayland = true
show_cheatsheet = false
# hyprland has no startup cheatsheet; upstream default is true.

[environment]
MOZ_ENABLE_WAYLAND = "1"
QT_QPA_PLATFORMTHEME = "gtk2"
# XDG_*/DISPLAY vars are owned by the compositor and can't be set here.

[output.DP-2]
mode = "1920x1080@165"
position = [0, 0]
scale = 1.0
cyclic_workspaces = true
# = hyprland allow_workspace_cycles.

[output.HDMI-A-1]
enabled = false

[output.eDP-1]
mode = "1920x1080@60"
position = [0, 0]
scale = 1.2
cyclic_workspaces = true

[workspaces]
back_and_forth = true
# = hyprland workspace_back_and_forth.

[layout]
mode = "master"
# = hyprland general:layout master.
gap = 5
# = hyprland gaps_in; gaps_out 10 has no separate equivalent.

[layout.scrolling]
default_extent_fraction = 0.6
# = hyprland scrolling column_width 0.6.

[layout.dwindle]
preserve_split = true
# hyprland force_split 2 has no equivalent.

[layout.master]
position = "left"

[appearance]
border_width = 2
corner_radius = 2
# = hyprland border_size/rounding (noctalia suggests 10; hyprland wins).

[appearance.blur]
enabled = false
# = hyprland blur disabled.

[input.keyboard]
layout = "pl"
numlock_toggle = true

[input.focus]
follows_mouse = true
# = hyprland follow_mouse 1.

[input.touchpad]
natural_scroll = false
sensitivity = 0.1
# = hyprland dell touchpad 0.1.

[input.mouse]
sensitivity = -0.5
# hyprland sets -0.5 per mouse (g403/vxe dongles); global until exact names
# from `libinput list-devices` are added as [[input.device]] entries.
# Gestures have no configurable equivalent; 3-finger workspace swipe is built in.

[keybinds]
# Defining this table replaces the built-in set, so everything wanted is here.

# Launchers
"Mod+T" = { action = "spawn:wezterm", repeat = false }
"Mod+B" = { action = "spawn:brave", repeat = false }
"Mod+E" = { action = "spawn:nemo", repeat = false }
"Mod+Y" = { action = "spawn:noctalia msg bar-toggle", repeat = false }
"Mod+N" = { action = "spawn:noctalia msg panel-open control-center notifications", repeat = false }
"Mod+R" = { action = "spawn:vicinae toggle", repeat = false }
"Mod+V" = { action = "spawn:vicinae vicinae://launch/clipboard/history", repeat = false }

# Windows (Mod+F = float like hyprland; fullscreen lives on Mod+Shift+F)
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+F" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
# hyprland double-binds P (pin, then pseudo wins); pinned is the sane pick.
"Mod+Shift+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+Escape" = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# Layout switchers (= hyprland M/D/S)
"Mod+M" = "workspace-set-layout:master"
"Mod+D" = "workspace-set-layout:dwindle"
"Mod+S" = "workspace-set-layout:scrolling"
"Mod+Ctrl+R" = "window-cycle-primary-extent"

# Focus
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+H" = "window-focus-left"
"Mod+L" = "window-focus-right"
"Mod+K" = "window-focus-up"
"Mod+J" = "window-focus-down"
"Mod+F1" = "window-focus-next"
# No keyboard window-move binds, like hyprland; Mod+drag moves natively.

# Workspaces 1-10 (10 on key 0), move (SHIFT), silent move (CTRL+SHIFT)
"Mod+1" = "workspace-switch:1"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Ctrl+Shift+1" = "window-move-to-workspace-silent:1"
"Mod+2" = "workspace-switch:2"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Ctrl+Shift+2" = "window-move-to-workspace-silent:2"
"Mod+3" = "workspace-switch:3"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Ctrl+Shift+3" = "window-move-to-workspace-silent:3"
"Mod+4" = "workspace-switch:4"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Ctrl+Shift+4" = "window-move-to-workspace-silent:4"
"Mod+5" = "workspace-switch:5"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Ctrl+Shift+5" = "window-move-to-workspace-silent:5"
"Mod+6" = "workspace-switch:6"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Ctrl+Shift+6" = "window-move-to-workspace-silent:6"
"Mod+7" = "workspace-switch:7"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Ctrl+Shift+7" = "window-move-to-workspace-silent:7"
"Mod+8" = "workspace-switch:8"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Ctrl+Shift+8" = "window-move-to-workspace-silent:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+9" = "window-move-to-workspace:9"
"Mod+Ctrl+Shift+9" = "window-move-to-workspace-silent:9"
"Mod+0" = "workspace-switch:10"
"Mod+Shift+0" = "window-move-to-workspace:10"
"Mod+Ctrl+Shift+0" = "window-move-to-workspace-silent:10"
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
# = hyprland Mod+mouse_down/up workspace cycle.
"Alt+Tab" = "workspace-focus-last"
# = hyprland previous_per_monitor.

# Overview = gloview on SUPER+TAB; Mod+O kept too
"Mod+Tab" = { action = "overview-toggle", repeat = false }
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+Shift+Tab" = "scratchpad-focus-next"

# Scratchpad defaults (no hyprland equivalent; kept so they stay usable)
"Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = { action = "window-restore-from-scratchpad", repeat = false }

# Screenshots (grim/slurp/hyprpicker speak wlr protocols, compositor-agnostic)
"Print" = { action = "spawn:screencapture shot monitor", repeat = false }
"Mod+Print" = { action = "spawn:screencapture shot all", repeat = false }
"Mod+Shift+S" = { action = "spawn:screencapture shot area", repeat = false }
"Mod+Shift+D" = { action = "spawn:screencapture record area", repeat = false }
"Mod+Shift+T" = { action = "spawn:screencapture extract area pl", repeat = false }
"Mod+Ctrl+Shift+T" = { action = "spawn:screencapture extract area eng", repeat = false }
"Mod+Shift+C" = { action = "spawn:hyprpicker -a -q -r", repeat = false }

# Media keys (locked = work on lock screen; volume repeats like hyprland bindel)
"XF86AudioLowerVolume" = { action = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-", allow_when_locked = true }
"XF86AudioRaiseVolume" = { action = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", allow_when_locked = true, repeat = false }
"XF86AudioPrev" = { action = "spawn:playerctl previous", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn:playerctl play-pause", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn:playerctl next", allow_when_locked = true, repeat = false }
"F12" = { action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", allow_when_locked = true, repeat = false }
# hyprland F9 (mute focused app via hyprctl) has no Umbriel equivalent; skipped.

# Mouse drag/resize needs no binds; Mod+drag moves, Mod+right-drag resizes.

[[window_rule]]
match.app_id = "^(Emulator)$"
default_floating = true

[[window_rule]]
match.app_id = "[Ww][Aa][Yy][Dd][Rr][Oo][Ii][Dd]"
default_floating = true
# ECMAScript has no (?i); hyprland class "(?i).*waydroid.*" spelled out.

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true
[[window_rule]]
match.is_alone = true
default_maximize_to_edges = true
# = hyprland smart gaps/borders: a lone tiled window drops gaps, struts and
# borders. Reverts automatically when a second tiled window appears.
# (is_alone counts tiled windows only; hyprland w[tv1]/f[1] workspace rules
# and the xwayland no-focus rule still have no equivalent; skipped.)

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"

[input]
window_drag_toggle = "floating"

[animation.workspaces]
enabled = false